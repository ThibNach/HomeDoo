[tool.poetry]
name = "homedoo-core"
version = "0.1.0"
description = "House management ERP"
authors = ["ThibNach <thibaut.spreux@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.1.3"
psycopg2-binary = "^2.9.11"
python-dotenv = "^1.2.2"
werkzeug = "^3.1.8"
flask-cors = "^6.0.2"
bcrypt = "^5.0.0"
pyjwt = "^2.12.1"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-mock = "^3.15.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = [
    "../../core/tests",
    "../../core/addons",
    "../../addons"
]
python_files = "test_*.py"
pythonpath = [
    "../../core/backend",
    "../../"
]